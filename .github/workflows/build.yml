name: Build Godot Game (Cross-Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  export:
    name: Export für ${{ matrix.platform }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3 
      
    strategy:
      matrix:
        platform: [Windows, macOS, Linux]

    steps:
      - name: 1. Code auschecken
        uses: actions/checkout@v4

      - name: 2. Abhängigkeiten installieren
        run: apt-get update && apt-get install -y fontconfig wget unzip

      - name: 3. Export Templates vorbereiten
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm Godot_v4.3-stable_export_templates.tpz

      - name: 4. Export-Ordner vorbereiten
        run: mkdir -p build/${{ matrix.platform }}

      - name: 5. Godot Export ausführen
        run: |
          cd pac-man-ae-prjekt
          
          # Zuerst: Einmaliger Import-Lauf, der sich selbst beendet
          godot --headless --path . --editor --quit || true
          
          # Jetzt der eigentliche Export
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            godot --headless --path . --export-release "Windows" ../build/Windows/game.exe
          elif [ "${{ matrix.platform }}" = "Linux" ]; then
            godot --headless --path . --export-release "Linux" ../build/Linux/game.x86_64
          elif [ "${{ matrix.platform }}" = "macOS" ]; then
            godot --headless --path . --export-release "macOS" ../build/macOS/game.zip
          fi

      - name: 6. Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: GodotGame-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/
