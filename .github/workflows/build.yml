name: Build Godot Game (Cross-Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  export:
    name: Export für ${{ matrix.platform }}
    runs-on: ubuntu-latest
    
    container:
      # Wir nutzen ein stabiles 4.3 Image, das oft Templates schon dabei hat
      image: barichello/godot-ci:4.3 
      
    strategy:
      matrix:
        platform: [Windows, macOS, Linux]

    steps:
      - name: 1. Code auschecken
        uses: actions/checkout@v4

      - name: 2. Fehlende Linux-Pakete installieren
        run: apt-get update && apt-get install -y fontconfig wget unzip

      - name: 3. Export Templates manuell nachladen
        run: |
          # Pfad erstellen, den Godot erwartet
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          # Templates runterladen (ca. 500MB, dauert einen Moment)
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          # Entpacken und in den richtigen Ordner schieben
          unzip Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm Godot_v4.3-stable_export_templates.tpz

      - name: 4. Export-Ordner vorbereiten
        run: mkdir -p build/${{ matrix.platform }}

      - name: 5. Godot Export ausführen
        run: |
          cd pac-man-ae-prjekt
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            godot --headless --path . --export-release "${{ matrix.platform }}" ../build/${{ matrix.platform }}/game.zip
          elif [ "${{ matrix.platform }}" = "Windows" ]; then
            godot --headless --path . --export-release "${{ matrix.platform }}" ../build/${{ matrix.platform }}/game.exe
          else
            godot --headless --path . --export-release "${{ matrix.platform }}" ../build/${{ matrix.platform }}/game.x86_64
          fi

      - name: 6. Fertiges Spiel als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: GodotGame-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/
