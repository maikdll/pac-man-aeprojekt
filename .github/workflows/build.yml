name: Build Godot Game (Cross-Platform)

on:
  push:
    branches: [ main ]

jobs:
  export:
    name: Export für ${{ matrix.platform }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        platform: [Windows, Linux, macOS]

    steps:
      - name: 1. Code auschecken
        uses: actions/checkout@v4

      - name: 2. Godot Export (Automated Tool)
        # Dieses Tool übernimmt das Template-Handling und den Headless-Export
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux_headless.64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./pac-man-ae-prjekt
          archive_export_output: true
          # Diese Namen MÜSSEN exakt so in deiner export_presets.cfg stehen:
          export_preset_name: ${{ matrix.platform }}

      - name: 3. Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: GodotGame-${{ matrix.platform }}
          # Das Tool legt die Dateien standardmäßig in 'out' ab
          path: /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/out/${{ matrix.platform }}
