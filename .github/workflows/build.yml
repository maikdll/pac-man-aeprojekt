name: Build-Godot-Stable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: Export-${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [Windows, Linux, macOS]

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Build-Folders
        run: mkdir -p build/${{ matrix.platform }}

      - name: Run-Export
        run: |
          cd pac-man-ae-prjekt
          
          rm -rf .godot
          rm -f project.godot.rf
          
          godot --headless --editor --quit || true
          godot --headless --editor --quit || true

          if [ "${{ matrix.platform }}" = "Windows" ]; then
            # Benennt die Datei zu game.exe
            godot --headless --path . --export-release "Windows" ../build/Windows/game.exe
          elif [ "${{ matrix.platform }}" = "macOS" ]; then
            # Benennt die App im ZIP zu game.zip (enthält game.app)
            godot --headless --path . --export-release "macOS" ../build/macOS/game.zip
          elif [ "${{ matrix.platform }}" = "Linux" ]; then
            # Benennt die Datei zu game.x86_64
            godot --headless --path . --export-release "Linux" ../build/Linux/game.x86_64
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodotGame-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Ändert den Namen der hochgeladenen Release-Datei zu "game-Plattform.zip/exe"
          files: |
            build/Windows/game.exe
            build/macOS/game.zip
            build/Linux/game.x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
