name: Build Godot Game (Cross-Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  export:
    name: Export für ${{ matrix.platform }}
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.6.1 
      
    strategy:
      matrix:
        # Diese Namen MÜSSEN exakt mit den Namen eurer Presets in Godot übereinstimmen!
        platform: [Windows Desktop, macOS, Linux]

    steps:
      - name: 1. Code auschecken
        uses: actions/checkout@v4

      - name: 2. Export-Ordner vorbereiten
        run: mkdir -p build/${{ matrix.platform }}

      - name: 3. Godot Export ausführen
        # Godot läuft hier unsichtbar im Hintergrund (--headless) und exportiert das Spiel
        run: |
          if [ "${{ matrix.platform }}" = "macOS" ]; then
            godot --headless --export-release "${{ matrix.platform }}" build/${{ matrix.platform }}/game.zip
          elif [ "${{ matrix.platform }}" = "Windows" ]; then
            godot --headless --export-release "${{ matrix.platform }}" build/${{ matrix.platform }}/game.exe
          else
            godot --headless --export-release "${{ matrix.platform }}" build/${{ matrix.platform }}/game.x86_64
          fi

      - name: 4. Fertiges Spiel als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: GodotGame-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/
